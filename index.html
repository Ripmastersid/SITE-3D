<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sidmarkting — Sites profissionais</title>
<link rel="icon" href="favicon-mark.png">
<style>
  * { margin:0; box-sizing:border-box; }
  body { height:100vh; overflow:hidden; font-family:Arial, sans-serif;
         background:radial-gradient(circle at 50% 30%, #0b1e45, #050b18); }
  #cena { position:fixed; inset:0; touch-action:none; }
  .topo { position:fixed; top:16px; left:16px; display:flex; align-items:center; gap:10px; z-index:3; }
  .topo img { width:36px; height:36px; border-radius:8px; }
  .topo span { color:#fff; font-weight:bold; font-size:18px; }
  .dica { position:fixed; bottom:8px; right:12px; color:#7d92c4; font-size:11px; z-index:3; }
  .ui { position:fixed; bottom:16px; left:16px; display:flex; gap:8px; z-index:3; flex-wrap:wrap; }
  .ui button { padding:8px 12px; border:1px solid rgba(255,255,255,.25); border-radius:8px;
               background:rgba(255,255,255,.08); color:#fff; cursor:pointer; font-size:12px; }
  .ui button.ativo { background:#25D366; border-color:#25D366; color:#04220f; font-weight:bold; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          color:#9db4e8; background:#050b18; z-index:5; transition:opacity .6s; }
  form { position:fixed; top:50%; right:6%; transform:translateY(-50%);
         width:300px; display:flex; flex-direction:column; gap:10px;
         background:rgba(255,255,255,.07); backdrop-filter:blur(12px);
         border:1px solid rgba(255,255,255,.15); padding:26px; border-radius:14px; z-index:2; }
  form h1 { color:#fff; font-size:19px; text-align:center; margin-bottom:6px; }
  input { padding:12px; border:none; border-radius:8px; background:rgba(255,255,255,.92); }
  #zap { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px;
         border:none; border-radius:8px; font-weight:bold; font-size:15px;
         background:#3a4358; color:#8b93a8; cursor:not-allowed; transition:.3s; }
  #zap.ativo { background:#25D366; color:#04220f; cursor:pointer;
               box-shadow:0 0 18px #25D36699; animation:pulsa 1.6s infinite; }
  @keyframes pulsa { 50% { box-shadow:0 0 30px #25D366cc; } }
  #zap svg { width:20px; height:20px; fill:currentColor; }
  @media (max-width:768px){
    form { right:50%; top:auto; bottom:20px; transform:translateX(50%); width:min(320px,92vw); }
    .ui  { bottom:auto; top:70px; }
    .dica{ bottom:auto; top:112px; }
  }
</style>
</head>
<body>

<div id="load">Carregando personagem…</div>
<div class="topo"><img src="favicon-mark.png" alt="logo"><span>sidmarkting</span></div>
<canvas id="cena"></canvas>
<div class="dica">1 dedo gira · 2 dedos ajusta o tamanho</div>

<div class="ui">
  <button data-anim="apontar" class="ativo">Apontar</button>
  <button data-anim="parado">Parado</button>
  <button data-anim="acenar">Acenar</button>
  <button data-anim="concordar">Concordar</button>
  <button data-anim="dancar">Dançar</button>
</div>

<form onsubmit="return false">
  <h1>Sites profissionais entre em contato</h1>
  <input id="nome"  placeholder="Nome">
  <input id="cel"   placeholder="Celular" inputmode="numeric">
  <input id="email" placeholder="E-mail" type="email">
  <button id="zap" disabled>
    <svg viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.7 57.4 2.8 3.7 39.4 60.1 95.4 83.6 35.4 15.1 48.5 13.7 57.2 12.8 13.2-1.4 32.8-13.4 37.4-26.4 4.6-13 4.6-24 3.2-26.4-1.4-2.5-5.1-3.9-10.6-6.7z"/></svg>
    Enviar
  </button>
</form>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const MODEL_URL='human-v2.glb', ZAP_NUM='5521966053200', DE_COSTAS=false;
const WX=new THREE.Vector3(1,0,0), WY=new THREE.Vector3(0,1,0), WZ=new THREE.Vector3(0,0,1);

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('cena'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x0a1230,2.2));
const luz=new THREE.DirectionalLight(0xffffff,2); luz.position.set(2,3,2); scene.add(luz);

const grade=new THREE.GridHelper(12,24,0x3b6fd4,0x1b3a75);
grade.material.transparent=true; grade.material.opacity=.35; scene.add(grade);
const sombra=new THREE.Mesh(new THREE.CircleGeometry(.55,32),
  new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
sombra.rotation.x=-Math.PI/2; sombra.position.y=.01;

const holder=new THREE.Group(), spinner=new THREE.Group();
holder.add(spinner); spinner.add(sombra); scene.add(holder);
function layout(){
  holder.position.x = innerWidth<768 ? 0 : -1.15;
  camera.position.set(0,1.35, innerWidth<768 ? 6.4 : 5.2);
  camera.lookAt(0,.95,0);
}
layout();

let grupo=null, bones={}, base={}, feetY=0, animAtual='apontar';

/* ============ DETECÇÃO ANATÔMICA POR GEOMETRIA (não depende de nomes) ============
   Proporções humanas (altura 1,8 m): ombros ~1,5 · cotovelos ~1,5 |x|~0,45 ·
   mãos |x| máx · quadril ~0,95 · joelhos ~0,5 · pés ~0,05                       */
function detectarRig(){
  const hp=new THREE.Vector3(); holder.getWorldPosition(hp);
  spinner.updateWorldMatrix(true,true);
  const B=[]; grupo.traverse(o=>{ if(o.isBone){ const v=new THREE.Vector3();
    o.getWorldPosition(v); v.sub(hp); B.push({o,v}); }});
  const maxX=Math.max(...B.filter(b=>b.v.y>1.2).map(b=>Math.abs(b.v.x)));
  for (const s of [1,-1]){
    const tag=s>0?'E':'D';
    const chain=B.filter(b=>b.v.y>1.2&&(s>0?b.v.x>0:b.v.x<0))
                 .sort((a,b)=>Math.abs(a.v.x)-Math.abs(b.v.x));
    bones['braco'+tag]=chain.find(b=>Math.abs(b.v.x)>0.10)?.o;  // ombro
    bones['ante'+tag] =chain.find(b=>Math.abs(b.v.x)>0.40)?.o;  // cotovelo
    bones['mao'+tag]  =chain.find(b=>Math.abs(b.v.x)>0.70*maxX)?.o; // punho
  }
  const pernas=B.filter(b=>b.v.y<1.0&&Math.abs(b.v.x)>0.04&&Math.abs(b.v.x)<0.35);
  for (const s of [1,-1]){
    const tag=s>0?'E':'D', ls=pernas.filter(b=>s>0?b.v.x>0:b.v.x<0);
    bones['perna'+tag]  =ls.find(b=>b.v.y>0.70)?.o;   // quadril/coxa
    bones['joelho'+tag] =ls.find(b=>b.v.y>0.30&&b.v.y<=0.70)?.o;
    bones['pe'+tag]     =ls.find(b=>b.v.y<=0.15)?.o;
  }
  const centro=B.filter(b=>Math.abs(b.v.x)<0.06);
  bones.head =centro.slice().sort((a,b)=>a.v.y-b.v.y).pop()?.o;
  bones.spine=centro.find(b=>b.v.y>1.05&&b.v.y<1.50)?.o;
  bones.hips =centro.find(b=>b.v.y>0.80&&b.v.y<=1.05)?.o;
  for (const k in bones) base[k]=bones[k].rotation.clone();
  console.log('🦴 Rig detectado:',Object.fromEntries(Object.entries(bones).map(([k,b])=>[k,b.name])));
}

const draco=new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
new GLTFLoader().setDRACOLoader(draco).load(MODEL_URL,gltf=>{
  grupo=gltf.scene; if (DE_COSTAS) grupo.rotation.y=Math.PI;
  const box=new THREE.Box3().setFromObject(grupo);
  const s=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  const k=1.8/s.y;
  grupo.scale.setScalar(k);
  grupo.position.set(-c.x*k,-box.min.y*k,-c.z*k);
  feetY=grupo.position.y;
  spinner.add(grupo);
  detectarRig();
  const ld=document.getElementById('load'); ld.style.opacity=0; setTimeout(()=>ld.remove(),700);
});

/* toque: 1 dedo gira · pinça = tamanho */
let userRot=0,userScale=1; const pts=new Map(); let pinch0=0,scale0=1;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const[a,b]=[...pts.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);scale0=userScale;}});
cvs.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1) userRot+=(e.clientX-p[0])*.006;
  else if(pts.size===2&&pinch0){const[a,b]=[...pts.values()];
    userScale=THREE.MathUtils.clamp(scale0*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch0,.35,2.5);}
});
addEventListener('pointerup',e=>pts.delete(e.pointerId));
cvs.addEventListener('wheel',e=>{userScale=THREE.MathUtils.clamp(userScale*(1-e.deltaY*.001),.35,2.5);},{passive:true});

document.querySelectorAll('.ui button').forEach(b=>b.onclick=()=>{
  animAtual=b.dataset.anim;
  document.querySelectorAll('.ui button').forEach(x=>x.classList.remove('ativo'));
  b.classList.add('ativo');
});

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();
  spinner.rotation.y=userRot; spinner.scale.setScalar(userScale);
  if (grupo){
    for (const k in bones) bones[k].rotation.copy(base[k]);
    grupo.position.y=feetY; // pés no chão, sempre

    /* POSE DE REPOUSO ANATÔMICA: braços arriados (adução ~75°) + cotovelo ~15° */
    if (bones.bracoE) bones.bracoE.rotateOnWorldAxis(WZ,-1.30);
    if (bones.bracoD) bones.bracoD.rotateOnWorldAxis(WZ, 1.30);
    if (bones.anteE)  bones.anteE.rotateOnWorldAxis(WX,-.25);
    if (bones.anteD)  bones.anteD.rotateOnWorldAxis(WX,-.25);

    /* vida: respiração + micro-olhar */
    if (bones.spine) bones.spine.rotateOnWorldAxis(WX,Math.sin(t*2)*.02);
    if (bones.head)  bones.head.rotateOnWorldAxis(WY,Math.sin(t*.7)*.05);

    if (animAtual==='parado'){
      if (bones.bracoE) bones.bracoE.rotateOnWorldAxis(WX,Math.sin(t*1.6)*.03);
      if (bones.bracoD) bones.bracoD.rotateOnWorldAxis(WX,Math.sin(t*1.6)*.03);
    }

    if (animAtual==='apontar'){
      const bal=Math.sin(t*1.3)*.05;
      if (bones.bracoE){bones.bracoE.rotateOnWorldAxis(WZ,1.40+bal);bones.bracoE.rotateOnWorldAxis(WX,-.12);}
      if (bones.anteE) bones.anteE.rotateOnWorldAxis(WZ,.20);
      if (bones.maoE)  bones.maoE.rotateOnWorldAxis(WZ,.10);
      if (bones.head)  bones.head.rotateOnWorldAxis(WY,.35);
      if (bones.spine) bones.spine.rotateOnWorldAxis(WY,.12);
    }

    if (animAtual==='acenar'){
      if (bones.bracoD) bones.bracoD.rotateOnWorldAxis(WZ,-1.25);
      if (bones.anteD)  bones.anteD.rotateOnWorldAxis(WZ,Math.sin(t*9)*.35-.15);
      if (bones.maoD)   bones.maoD.rotateOnWorldAxis(WZ,Math.sin(t*9)*.15);
      if (bones.head)   bones.head.rotateOnWorldAxis(WY,Math.sin(t*1.4)*.12);
    }

    if (animAtual==='concordar'){
      if (bones.head)  bones.head.rotateOnWorldAxis(WX,Math.sin(t*5)*.28);
      if (bones.spine) bones.spine.rotateOnWorldAxis(WX,Math.sin(t*5)*.07);
    }

    if (animAtual==='dancar'){
      const s=Math.sin(t*4), q=Math.max(0,s), q2=Math.max(0,-s);
      if (bones.hips)  bones.hips.rotateOnWorldAxis(WY,s*.18);
      if (bones.spine) bones.spine.rotateOnWorldAxis(WY,-s*.10);
      if (bones.bracoE) bones.bracoE.rotateOnWorldAxis(WX,-s*.45); // braços balançam
      if (bones.bracoD) bones.bracoD.rotateOnWorldAxis(WX, s*.45); // oposto às pernas
      if (bones.anteE)  bones.anteE.rotateOnWorldAxis(WX,-.5);
      if (bones.anteD)  bones.anteD.rotateOnWorldAxis(WX,-.5);
      if (bones.pernaE) bones.pernaE.rotateOnWorldAxis(WX,-q*.35);  // joelho sobe
      if (bones.joelhoE)bones.joelhoE.rotateOnWorldAxis(WX, q*.55); // canela dobra
      if (bones.peE)    bones.peE.rotateOnWorldAxis(WX,-q*.25);
      if (bones.pernaD) bones.pernaD.rotateOnWorldAxis(WX,-q2*.35);
      if (bones.joelhoD)bones.joelhoD.rotateOnWorldAxis(WX, q2*.55);
      if (bones.peD)    bones.peD.rotateOnWorldAxis(WX,-q2*.25);
      /* SEM flutuar: o corpo NÃO sobe — só o pé que levanta */
    }
  }
  renderer.render(scene,camera);
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); layout();
});

/* formulário + WhatsApp */
const nome=document.getElementById('nome'),cel=document.getElementById('cel'),
      mail=document.getElementById('email'),zap=document.getElementById('zap');
cel.addEventListener('input',()=>{
  let d=cel.value.replace(/\D/g,'').slice(0,11);
  if(d.length>6)d=`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if(d.length>2)d=`(${d.slice(0,2)}) ${d.slice(2)}`;
  cel.value=d;
});
function valida(){
  const ok=nome.value.trim().length>=2&&cel.value.replace(/\D/g,'').length>=10&&/.+@.+\..+/.test(mail.value);
  zap.disabled=!ok; zap.classList.toggle('ativo',ok);
}
[nome,cel,mail].forEach(i=>i.addEventListener('input',valida));
zap.onclick=()=>{
  if(zap.disabled)return;
  const msg=`Olá! Meu nome é ${nome.value}. 📧 ${mail.value} | 📱 ${cel.value}. Quero um site profissional!`;
  window.open(`https://wa.me/${ZAP_NUM}?text=${encodeURIComponent(msg)}`);
};
</script>
</body>
</html>
