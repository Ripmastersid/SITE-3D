<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sidmarkting — Sites profissionais</title>
<link rel="icon" href="favicon-mark.png">
<style>
  * { margin:0; box-sizing:border-box; }
  body { height:100vh; overflow:hidden; font-family:Arial, sans-serif;
         background:radial-gradient(circle at 50% 30%, #0b1e45, #050b18); }
  #cena { position:fixed; inset:0; }

  /* topo: logo + nome */
  .topo { position:fixed; top:16px; left:16px; display:flex; align-items:center;
          gap:10px; z-index:3; }
  .topo img { width:36px; height:36px; border-radius:8px; }
  .topo span { color:#fff; font-weight:bold; font-size:18px; letter-spacing:.5px; }

  /* carregando */
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          color:#9db4e8; background:#050b18; z-index:5; transition:opacity .6s; }

  /* formulário */
  form { position:fixed; top:50%; right:8%; transform:translateY(-50%);
         width:300px; display:flex; flex-direction:column; gap:10px;
         background:rgba(255,255,255,.07); backdrop-filter:blur(12px);
         border:1px solid rgba(255,255,255,.15); padding:26px; border-radius:14px; z-index:2; }
  form h1 { color:#fff; font-size:19px; text-align:center; margin-bottom:6px; }
  input { padding:12px; border:none; border-radius:8px; background:rgba(255,255,255,.92); }
  #zap { display:flex; align-items:center; justify-content:center; gap:8px;
         padding:12px; border:none; border-radius:8px; font-weight:bold; font-size:15px;
         background:#3a4358; color:#8b93a8; cursor:not-allowed; transition:.3s; }
  #zap.ativo { background:#25D366; color:#04220f; cursor:pointer;
               box-shadow:0 0 18px #25D36699; animation:pulsa 1.6s infinite; }
  @keyframes pulsa { 50% { box-shadow:0 0 30px #25D366cc; } }
  #zap svg { width:20px; height:20px; fill:currentColor; }

  @media (max-width:768px){
    form { right:50%; top:auto; bottom:20px; transform:translateX(50%); width:min(320px,92vw); }
  }
</style>
</head>
<body>

<div id="load">Carregando personagem…</div>

<div class="topo">
  <img src="favicon-mark.png" alt="logo">
  <span>sidmarkting</span>
</div>

<canvas id="cena"></canvas>

<form onsubmit="return false">
  <h1>Sites profissionais entre em contato</h1>
  <input id="nome"  placeholder="Nome">
  <input id="cel"   placeholder="Celular" inputmode="numeric">
  <input id="email" placeholder="E-mail" type="email">
  <button id="zap" disabled>
    <svg viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.7 57.4 2.8 3.7 39.4 60.1 95.4 83.6 35.4 15.1 48.5 13.7 57.2 12.8 13.2-1.4 32.8-13.4 37.4-26.4 4.6-13 4.6-24 3.2-26.4-1.4-2.5-5.1-3.9-10.6-6.7z"/></svg>
    Enviar
  </button>
</form>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ============ CONFIGURAÇÃO ============ */
const MODEL_URL = 'human-v2.glb';      // ← se renomear o arquivo, muda aqui
const ZAP_NUM   = '5521966053200';     // 21 96605-3200
/* ====================================== */

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cena'),
                                           antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 100);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x0a1230, 2.2));
const luz = new THREE.DirectionalLight(0xffffff, 2);
luz.position.set(2, 3, 2);
scene.add(luz);

const S = { bracoD: 1, bracoE: 1, head: 1, hips: 1 }; // se algo ficar espelhado, troque 1 por -1
const PROCURA = {
  hips  : ['hips','hip','pelvis'],
  spine : ['spine1','spine2','chest','spine','torso'],
  head  : ['head','neck'],
  bracoE: ['leftarm','leftshoulder','left_arm','arm_l','l_arm'],
  anteE : ['leftforearm','leftlowerarm','leftelbow','forearm_l'],
  bracoD: ['rightarm','rightshoulder','right_arm','arm_r','r_arm'],
  anteD : ['rightforearm','rightlowerarm','rightelbow','forearm_r'],
};
const norm = n => n.toLowerCase().replace(/[^a-z]/g,'');

let grupo = null, bones = {}, base = {}, baseX = 0, baseY = 0;

function layout(){
  const mob = innerWidth < 768;
  baseX = mob ? 0 : -1.15;
  baseY = mob ? .75 : 0;
  camera.position.set(0, mob ? .9 : .4, mob ? 5.4 : 4.2);
  camera.lookAt(0, mob ? .7 : 0, 0);
  if (grupo){ grupo.position.x = baseX; }
}
layout();

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
new GLTFLoader().setDRACOLoader(draco).load(MODEL_URL, gltf => {
  const modelo = gltf.scene;
  const box = new THREE.Box3().setFromObject(modelo);
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  modelo.position.sub(c);
  grupo = new THREE.Group();
  grupo.add(modelo);
  grupo.scale.setScalar(1.8 / Math.max(s.x, s.y, s.z));
  grupo.position.x = baseX; grupo.position.y = baseY;
  scene.add(grupo);
  // grupo.rotation.y = Math.PI; // descomente se ele ficar de costas

  const todos = [];
  grupo.traverse(o => { if (o.isBone) todos.push(o); });
  console.log('🦴 Bones:', todos.map(b => b.name)); // cola aqui pra eu calibrar
  for (const [k, cands] of Object.entries(PROCURA))
    for (const cd of cands){
      const b = todos.find(b => norm(b.name).includes(cd));
      if (b){ bones[k] = b; base[k] = b.rotation.clone(); break; }
    }
  const ld = document.getElementById('load');
  ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
});

/* ===== animação de lobby: respiração + leve balanço, sempre ativa ===== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (grupo){
    for (const k in bones) bones[k].rotation.copy(base[k]);

    // respiração / peso no corpo
    if (bones.spine) bones.spine.rotation.x += Math.sin(t*2)*.03;
    // cabeça olhando ao redor, bem sutil
    if (bones.head)  bones.head.rotation.y  += Math.sin(t*.7)*.06;
    // flutuação vertical leve, como se estivesse "vivo" parado
    grupo.position.y = baseY + Math.sin(t*2)*.02;

    // balanço leve dos braços, idle contínuo
    if (bones.bracoE) bones.bracoE.rotation.z += Math.sin(t*1.6)*.04*S.bracoE;
    if (bones.bracoD) bones.bracoD.rotation.z -= Math.sin(t*1.6)*.04*S.bracoD;
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  layout();
});

/* ===== formulário + WhatsApp ===== */
const nome = document.getElementById('nome'),
      cel  = document.getElementById('cel'),
      mail = document.getElementById('email'),
      zap  = document.getElementById('zap');

cel.addEventListener('input', () => {           // máscara (21) 99999-9999
  let d = cel.value.replace(/\D/g,'').slice(0,11);
  if (d.length > 6)      d = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 2) d = `(${d.slice(0,2)}) ${d.slice(2)}`;
  cel.value = d;
});

function valida(){
  const ok = nome.value.trim().length >= 2
          && cel.value.replace(/\D/g,'').length >= 10
          && /.+@.+\..+/.test(mail.value);
  zap.disabled = !ok;
  zap.classList.toggle('ativo', ok);
}
[nome, cel, mail].forEach(i => i.addEventListener('input', valida));

zap.onclick = () => {
  if (zap.disabled) return;
  const msg = `Olá! Meu nome é ${nome.value}. 📧 ${mail.value} | 📱 ${cel.value}. Quero um site profissional!`;
  window.open(`https://wa.me/${ZAP_NUM}?text=${encodeURIComponent(msg)}`);
};
</script>
</body>
</html>
